name: pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { fetch-depth: 0 }
      - name: gitleaks (secrets)
        # Not gitleaks-action: it scans a commit RANGE (base^..head), and on a
        # repo's first push the base is the root commit, which has no parent —
        # git errors out and the job fails without scanning anything. Scanning
        # the tree directly works whatever the history looks like.
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.0/gitleaks_8.30.0_linux_x64.tar.gz \
            | tar xz -C /tmp gitleaks
          /tmp/gitleaks dir . --redact --verbose --exit-code 1
  iac:
    name: IaC scan (Checkov + tfsec)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Checkov (hard gate, documented baseline)
        uses: bridgecrewio/checkov-action@444c9db6fa75e2d9c19ebf1fde7322089be9009e # v12
        with:
          directory: terraform/
          quiet: true
          soft_fail: false
          # Reviewed, accepted trade-offs for a single-user free-tier tool.
          # Rationale for each is documented in .checkov.yaml. A NEW finding
          # outside this list still fails the build.
          skip_check: CKV2_AWS_51,CKV_AWS_68,CKV_AWS_86,CKV_AWS_310,CKV2_AWS_47,CKV2_AWS_29,CKV_AWS_76,CKV_AWS_225,CKV_AWS_120,CKV_AWS_18,CKV_AWS_144,CKV2_AWS_62,CKV_AWS_21,CKV_AWS_145,CKV_AWS_119,CKV_AWS_26,CKV_AWS_50,CKV_AWS_115,CKV_AWS_116,CKV_AWS_117,CKV_AWS_173,CKV_AWS_272,CKV_AWS_158,CKV_AWS_338,CKV_AWS_342,CKV2_AWS_67,CKV2_AWS_32,CKV2_AWS_42,CKV2_AWS_57,CKV2_AWS_61,CKV_AWS_149,CKV_AWS_174,CKV_AWS_374,CKV_VALIDATE_SECRETS
      - name: tfsec (advisory)
        uses: aquasecurity/tfsec-action@b466648d6e39e7c75324f25d83891162a721f2d6 # v1.0.3
        with:
          working_directory: terraform/
          soft_fail: true

  deps:
    name: Vulnerability scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

  test:
    name: Unit tests (all Lambdas)
    runs-on: ubuntu-latest
    env:
      AWS_DEFAULT_REGION: us-east-1 # boto3 clients are built at module import (no API calls)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with: { python-version: "3.13" }
      - run: pip install pytest boto3 # boto3: several modules build clients at import (no API calls)
      - name: Every Lambda's tests (each src/<fn>/ with a test_*.py)
        env:
          APPS_TABLE: t
          EVENTS_TABLE: e
          DOCS_BUCKET: b
        run: |
          set -e
          total=0
          for d in src/*/; do
            if ls "$d"/test_*.py >/dev/null 2>&1; then
              echo "== $d"
              (cd "$d" && python -m pytest -q)
              total=$((total+1))
            fi
          done
          echo "ran test suites for $total functions"
          test "$total" -ge 12

  validate:
    name: Terraform validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
      - name: fmt + validate
        working-directory: terraform
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false
          terraform validate

  # tflint catches what `terraform validate` cannot: unused declarations, missing
  # provider version constraints, invalid instance types. It found an unpinned
  # `archive` provider in two of these repos.
  tflint:
    name: tflint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: terraform-linters/setup-tflint@1cf010d3c7aef302051ccdb68c14c5dc2efa34ef # v6
        with:
          tflint_version: v0.64.0
      - name: tflint
        working-directory: ${{ github.workspace }}
        # GITHUB_TOKEN is not optional here. `tflint --init` downloads the ruleset
        # plugins from the GitHub releases API, and unauthenticated that call shares
        # a rate limit with every other runner on the same egress IP -- so it works
        # until the day the account is busy, then fails with "403 API rate limit
        # exceeded" having linted nothing. That is exactly how it broke: merging a
        # batch of dependency PRs ran enough CI to exhaust it. The token is issued
        # to every workflow run automatically and needs no setup.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tflint --init --config="${{ github.workspace }}/.tflint.hcl"
          tflint --chdir=terraform --config="${{ github.workspace }}/.tflint.hcl"

  # `terraform test` against a mocked provider: no cloud account, no cost. It
  # asserts the specific promises this repo's README makes — which a generic
  # scanner cannot know.
  terraform-test:
    name: terraform test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with: { terraform_wrapper: false }
      - name: terraform test
        working-directory: ${{ github.workspace }}/terraform
        run: |
          terraform init -backend=false
          terraform test

  # Lint, including bandit's security rules. Every exclusion in ruff.toml carries
  # the reason it is there — a silent exclusion is indistinguishable from a bug
  # nobody noticed.
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          version: 0.16.8
          args: check --output-format github

  # GitHub's semantic analysis, free on public repos, reporting into the Security
  # tab. It reads data flow across files, which neither ruff nor checkov does.
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          languages: python
          queries: security-and-quality
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4

  # Blocks a PR that introduces a dependency with a known vulnerability or a
  # licence that does not fit. Renovate keeps things current; this stops a bad
  # one arriving in the first place.
  dependency-review:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    # Requires "Dependency graph" enabled in repo settings, which a workflow
    # cannot turn on for itself. Non-blocking so a repo without it reports the
    # gap instead of failing every PR.
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: always
